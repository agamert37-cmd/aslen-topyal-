<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: iPhone notch / Dynamic Island alanını kaplama -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>İŞLEYEN ET</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Tarayıcı adres çubuğu rengi -->
    <meta name="theme-color" content="#06090f" />

    <!-- iOS tam ekran / PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="İŞLEYEN ET" />

    <!-- Android PWA -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS otomatik telefon numarası tespitini kapat -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <!-- Electron Custom Titlebar -->
    <div id="electron-titlebar" style="display: none; height: 35px; background: #0d111b; border-bottom: 1px solid #1f2937; -webkit-app-region: drag; position: relative; width: 100%; z-index: 9999; align-items: center; justify-content: space-between; padding-left: 16px; color: #fff; font-family: sans-serif; font-size: 13px; font-weight: 600;">
      <div>İŞLEYEN ET DESKTOP</div>
      <div style="-webkit-app-region: no-drag; display: flex; height: 100%;">
        <button onclick="window.electronAPI.minimize()" style="background:transparent; border:none; color:white; width: 46px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px;">_</button>
        <button onclick="window.electronAPI.maximize()" style="background:transparent; border:none; color:white; width: 46px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px;">☐</button>
        <button onclick="window.electronAPI.close()" style="background:transparent; border:none; color:white; width: 46px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px;" onmouseover="this.style.backgroundColor='#e81123'" onmouseout="this.style.backgroundColor='transparent'">✕</button>
      </div>
    </div>
    
    <div id="root"></div>

    <script>
      if (window.electronAPI && window.electronAPI.isElectron) {
        document.getElementById('electron-titlebar').style.display = 'flex';
        // Add a global CSS variable for electron titlebar height to be used by React if needed
        document.documentElement.style.setProperty('--electron-titlebar-height', '35px');
        document.body.classList.add('is-electron');
      }
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
